# Site Configuration
[site]
  title            = "H A V N & COMPANY"
  description      = "AGA Associates provides reliable CA services, including tax planning, auditing, compliance, and financial consulting to help businesses thrive."
  tagline          = "Chartered Accountants & Financial Consultants"
  taglineSeparator = ""
  baseUrl          = "https://www.agaassociates.com/"
  logo             = "/images/logo.png"
  logoAlternate    = ""
  logoText         = ""
  logoWidth        = "240px"
  logoHeight       = "48px"
  trailingSlash    = true

  [site.favicon]
    path  = "/images/favicons"
    image = "/images/favicon.png"

# SEO Metadata
[seo]
  author = "AGA Associates"
  keywords = [
    "Chartered Accountants Nabha",
    "CA Firm Patiala Punjab",
    "Income Tax Return ITR Filing",
    "GST Registration and Tax Audit",
    "Statutory Audit and Assurance Services",
    "Company Incorporation and Registration",
    "NRI Tax Filing and FEMA Compliance",
    "Bank Loan Project Finance CMA Data",
    "Financial Advisory and Wealth Management",
    "Business Accounting Software Consultancy",
    "H A V N & COMPANY",
    "AGA Associates"
  ]
  robots = "index, follow"

  [seo.robotsTxt]
    enable   = true
    disallow = []

  [seo.sitemap]
    enable  = true
    exclude = []

# Theme & Site Settings
[settings]
  blogFolder     = "blog"
  servicesFolder = "services"
  blogPagination = 6
  pagination     = 8
  stickyHeader   = true

  contactFormAction   = "https://formsubmit.co/info@agaassociates.com"
  contactFormProvider = "formsubmit.co"
  footerDescription   = ""

  [settings.smoothScroll]
    enable                = true
    respectReducedMotion  = true
    duration              = 1.1
    easing                = "expo"
    smoothWheel           = true
    syncTouch             = false
    wheelMultiplier       = 1
    touchMultiplier       = 1
    anchors               = true
    autoRaf               = true
    stopInertiaOnNavigate = true

  [settings.animation]
    enable               = true
    respectReducedMotion = true
    easing               = "cubic-bezier(0.22, 1, 0.36, 1)"
    duration             = ""
    distance             = "2rem"
    blur                 = "10px"
    rootMargin           = "0px 0px -8% 0px"
    threshold            = 0.14

  [settings.copyright]
    enable = true
    text   = ""

  [settings.subscription]
    enable            = true
    title             = ""
    note              = ""
    formAction        = "https://gmail.us11.list-manage.com/subscribe/post?u=d870b06d86c16269e4b1f9b39&amp;id=12cf0c6ac2&amp;f_id=007e61e1f0"
    mailchimpTagValue = ""

  [settings.multilingual]
    enable               = true
    defaultLanguage      = "en"
    disableLanguages     = ["fr"]
    showDefaultLangInUrl = false

  [settings.contactInfo]
    phone       = "[+91 99140-14949](tel:+919914014949)"
    email       = "[info@agaassociates.com](mailto:info@agaassociates.com)"
    address     = "202 Hira Enclave Bhawanigarh Road, Distt. Patiala Nabha, 147201"
    officeHours = "Office Hours: 9:30 AM – 7:00 PM"

  [settings.headerOffcanvas]
    enable      = true
    logo        = ""
    description = ""

    [settings.headerOffcanvas.button]
      enable = true
      label  = ""
      url    = "/#contact"

[settings.navigationButton]
  enable = true
  label  = ""
  url    = "/#contact"

[settings.markup.tableOfContents]
  enable     = true
  expanded   = false
  endLevel   = 5
  ordered    = false
  startLevel = 1

# OpenGraph Metadata
[opengraph]
  image       = "/images/og-image.jpg"
  ogLocale    = "en_US"
  ogType      = "website"
  twitter     = ""
  twitterCard = "summary_large_image"

[head]
  content = """
  <script></script>
  """
